[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tts-client"
version = "2.0.0"
description = "Desktop client for the Test Tracking System"
authors = [{name = "yesq"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyQt5",
    "requests",
    "cryptography",
    "psutil",
    "pynput",
    "pycaw",
    "comtypes",
    "screen-brightness-control",
    "opencv-python",
    "pywin32",
]

[project.scripts]
tts-client = "run:main"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "config*",
    "services*",
    "models*",
    "monitoring*",
    "ui*",
    "utils*",
    "widgets*",
]

[tool.setuptools]
py-modules = ["run", "build"]
